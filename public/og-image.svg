<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1a2842"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e09b6b"/>
      <stop offset="1" stop-color="#d4a853"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Lignes decoratives -->
  <line x1="0" y1="180" x2="1200" y2="180" stroke="#e8d5b5" stroke-opacity="0.06"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#e8d5b5" stroke-opacity="0.06"/>

  <!-- Monogramme Q a droite -->
  <g opacity="0.9" transform="translate(950, 230)">
    <circle cx="80" cy="80" r="78" fill="none" stroke="url(#copper)" stroke-width="14" opacity="0.85"/>
    <line x1="108" y1="128" x2="170" y2="195" stroke="url(#copper)" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Label -->
  <text x="90" y="135" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="8" fill="#9fb0c4">PORTFOLIO</text>

  <!-- Nom -->
  <text x="84" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="bold" fill="#f4efe6">QUENTIN</text>
  <text x="84" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="bold" font-style="italic" fill="url(#copper)">DOUILLY</text>

  <!-- Role -->
  <text x="90" y="510" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#c9b89a">Développeur polyvalent</text>

  <!-- Tagline bas -->
  <text x="90" y="578" font-family="Arial, sans-serif" font-size="19" letter-spacing="3" fill="#7d8aa0">WEB · JEUX · VR · 3D · DATA</text>
</svg>
